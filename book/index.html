<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书收藏</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      max-width: 560px;
      margin: 24px auto;
      padding: 0 16px;
    }

    form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input {
      padding: 6px;
    }

    button {
      cursor: pointer;
    }

    .tip {
      color: #c00;
      font-size: 14px;
      min-height: 20px;
    }

    li {
      margin: 8px 0;
    }

    .del {
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <h1>图书收藏</h1>

  <form id="book-form">
    <input type="text" id="title-input" placeholder="书名">
    <input type="text" id="author-input" placeholder="作者">
    <input type="number" id="rating-input" placeholder="评分" min="0" max="10" step="0.1">
    <button type="submit">添加</button>
  </form>

  <p class="tip" id="tip"></p>

  <ul id="book-list"></ul>

  <script src="app.js"></script>
</body>
</html>
